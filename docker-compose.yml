services:

  kcdb:
    image: mysql:8.0.23
    platform: linux/amd64
    container_name: ersd_kcdb
    volumes:
      - kcdb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_DB_DATABASE}
      MYSQL_USER: ${KEYCLOAK_DB_USER}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - 3306:3306
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${KEYCLOAK_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    container_name: ersd_keycloak
    image: ersd-keycloak:26.7.3
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      provenance: false
      sbom: false
    depends_on:
      kcdb:
        condition: service_healthy
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: kcdb
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      JDBC_PARAMS: useSSL=true
      KC_HEALTH_ENABLED: true
      # Disable clustering for single instance
      KC_CACHE: local
    ports:
      - 8080:8080
      - 8443:8443
    restart: on-failure:3
    # depends_on:
    #   - kcdb
    # volumes:
    #   - ./themes:/opt/keycloak/themes/ersd

volumes:
  kcdb_data:
    driver: local



